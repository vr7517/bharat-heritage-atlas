# fly.toml app configuration file generated for Bharat Heritage Atlas
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "bharat-heritage-atlas"
primary_region = "sin"

[build]

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "info"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/var/www/html/storage/database/database.sqlite"
  SESSION_DRIVER = "database"
  CACHE_STORE = "database"
  QUEUE_CONNECTION = "database"
  SESSION_LIFETIME = "120"
  SESSION_SECURE_COOKIE = "true"

# Persistent Volume for SQLite Database and Public Media Uploads
[mounts]
  source = "bha_storage"
  destination = "/var/www/html/storage"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/up"

# Note: For SQLite applications, database migrations are handled during container boot in .fly/entrypoint.sh 
# because Fly.io release_command runs in a detached machine without the persistent volume mounted.
# [deploy]
#   release_command = "php /var/www/html/artisan migrate --force"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
